services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    user: "1000:1000"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 128
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${ODEN_WORKSPACE_ROOT:?ODEN_WORKSPACE_ROOT must point to the selected project}:/home/sandbox/workspace
    working_dir: /home/sandbox/workspace
    stdin_open: true
    tty: true
