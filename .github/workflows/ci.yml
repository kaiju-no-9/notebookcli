name: CI
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run typecheck
      - run: bun test --parallel=1
      - run: bun run build
      - run: npm pack --dry-run
      - name: Install packed CLI and smoke test
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/oden-npm-prefix" "$RUNNER_TEMP"/oden-agent-*.tgz
          "$RUNNER_TEMP/oden-npm-prefix/bin/oden" --help
          "$RUNNER_TEMP/oden-npm-prefix/bin/oden" --version
